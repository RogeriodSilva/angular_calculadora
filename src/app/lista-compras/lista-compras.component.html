<div class="container mx-auto fixed inset-0 flex justify-center items-center p-4">
      <div class="flex flex-col space-y-2">
            <h1>Lista de Compras</h1>

            <form #frm="ngForm" (ngSubmit)="adicionar()">
                  <div class="w-100 md:w-[32rem] flex items-center justify-stretch space-x-4">
                        <input
                              type="text"
                              name="tarefa-name"
                              class="border border-zinc-200 w-full rounded p-2"
                              placeholder="Digite um novo item"
                              [(ngModel)]="item"
                        />
                        <div>
                              <button type="button" class="bg-red-500 p-2 rounded cursor-pointer hover:bg-red-800" (click)="limpar()">🗑</button>
                        </div>
                  </div>
            </form>

            <div class="h-128 overflow-y-auto">
                  <table class="table-auto w-full">
                        <thead>
                              <tr>
                                    <td>ID</td>
                                    <td>Nome</td>
                                    <td>Comprado</td>
                              </tr>
                        </thead>
                        <tbody>
                              <!-- <tr *ngFor="let elemento of lista">
                                    <td>{{ elemento.id }}</td>
                                    <td>{{ elemento.item }}</td>
                                    <td>
                                          <input
                                                type="checkbox"
                                                name="name"
                                                [(ngModel)]="elemento.check"
                                          />
                                    </td>
                              </tr> -->

                              @for (elemento of lista; track elemento.id) {
                                    <tr>
                                          <td [ngClass]="{'bg-emerald-200': elemento.check}">{{ elemento.id }}</td>
                                          <td [ngClass]="{'bg-emerald-200': elemento.check}">{{ elemento.item }}</td>
                                          <td [ngClass]="{'bg-emerald-200': elemento.check}">
                                                <input
                                                      type="checkbox"
                                                      name="name"
                                                      (click)="comprado(elemento)"
                                                      [(ngModel)]="elemento.check"
                                                      [checked]="elemento.check"
                                                />
                                          </td>
                                    </tr>
                              } @empty {
                                    <span class="p-2 w-100 text-center">
                                          Nenhum Item Adicionado
                                    </span>
                              }
                        </tbody>
                  </table>
            </div>
      </div>
</div>
